    <!-- Preloader: inline so it paints before any JS/CSS arrives. Animated out by src/lib/loader.js -->
    <style>
      html.ld-on { overflow: hidden; }
      #loader { position: fixed; inset: 0; z-index: 9800; color: #efeadf; font-family: 'JetBrains Mono Variable', ui-monospace, monospace; }
      #loader .ld__panel { position: absolute; inset: 0; will-change: transform; }
      #loader .ld__panel--forest { background: #2e6420; }
      #loader .ld__panel--ink { background: #0e1510; }
      #loader .ld__inner { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; padding: clamp(20px, 4.2vw, 72px); }
      #loader .ld__center { grid-row: 2; display: grid; justify-items: center; gap: 22px; }
      #loader .ld__mark { width: 64px; height: 64px; animation: ld-mark 1.2s cubic-bezier(0.19, 1, 0.22, 1) both; }
      #loader .ld__word { display: flex; overflow: hidden; font-family: 'Instrument Serif', 'Times New Roman', serif; font-size: clamp(2.6rem, 7vw, 6rem); line-height: 1.05; letter-spacing: -0.02em; padding: 0 0.05em; }
      #loader .ld__word span { display: block; animation: ld-rise 1.1s cubic-bezier(0.19, 1, 0.22, 1) both; animation-delay: calc(0.15s + var(--i) * 0.04s); }
      #loader .ld__word em { display: flex; color: #f0a820; }
      #loader .ld__foot { grid-row: 3; align-self: end; width: 100%; display: flex; justify-content: space-between; align-items: end; gap: 16px; }
      #loader .ld__meta { overflow: hidden; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: #a3ab9f; }
      #loader .ld__meta span { display: block; animation: ld-rise 1s 0.5s cubic-bezier(0.19, 1, 0.22, 1) both; }
      #loader .ld__count { overflow: hidden; font-family: 'Instrument Serif', 'Times New Roman', serif; font-size: clamp(3.4rem, 9vw, 8rem); line-height: 0.9; font-variant-numeric: tabular-nums; }
      #loader .ld__num { display: block; animation: ld-rise 1s 0.35s cubic-bezier(0.19, 1, 0.22, 1) both; }
      #loader .ld__bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(239, 234, 223, 0.12); }
      #loader .ld__bar i { display: block; height: 100%; background: #f0a820; transform: scaleX(0); transform-origin: left center; }
      @keyframes ld-rise { from { transform: translateY(110%); } }
      @keyframes ld-mark { from { opacity: 0; transform: scale(0.6) rotate(-25deg); } }
      @media (max-width: 560px) { #loader .ld__meta span + span { display: none; } }
      @media (prefers-reduced-motion: reduce) { #loader * { animation: none !important; } }
    </style>
